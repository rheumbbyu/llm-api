<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Lab Stream Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
    textarea { width: 100%; height: 80px; font-size: 16px; }
    button { margin-top: 8px; padding: 8px 16px; font-size: 16px; }
    #output { margin-top: 16px; padding: 12px; min-height: 80px; border: 1px solid #ccc; border-radius: 8px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>🧪 Lab Stream Demo</h1>
  <textarea id="prompt">Tell me a story about a brave little cell</textarea> 
  <button id="send">Send sample</button>
  <div id="output"></div>

  <script>
    const output = document.getElementById("output");

    document.getElementById("send").addEventListener("click", async () => {
      output.textContent = "";

      // 1. Submit the sample to the streaming counter
      const response = await fetch("/v1/generate/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt: document.getElementById("prompt").value }),
      });

      // 2. Rejected at triage? (e.g. empty tube → 422)
      if (!response.ok) {
        output.textContent = "Sample rejected: " + response.status;
        return;
      }

      // 3. Listen on the open phone line
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let notepad = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        notepad += decoder.decode(value, { stream: true });

        // 4. Split into complete messages (each ends with a blank line)
        const messages = notepad.split("\n\n");
        notepad = messages.pop();  // keep any half-heard message for later

        // 5. Write each result on the screen
        for (const msg of messages) {
          const data = msg.replace("data: ", "");
          if (data === "[DONE]") return;
          output.textContent += JSON.parse(data).token;
        }
      }
    });
  </script>
</body>
</html>
